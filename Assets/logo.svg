<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150" width="150" height="150">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#7b2ff7"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="4" y="4" width="142" height="142" rx="24" ry="24" fill="url(#bg)"/>

  <!-- Subtle inner border -->
  <rect x="4" y="4" width="142" height="142" rx="24" ry="24" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.4"/>

  <!-- Music note -->
  <g transform="translate(48, 32)">
    <!-- Note head -->
    <ellipse cx="26" cy="58" rx="16" ry="13" fill="url(#accent)" transform="rotate(-20, 26, 58)"/>
    <!-- Stem -->
    <rect x="39" y="0" width="5" height="58" rx="2.5" fill="#e0e0ff"/>
    <!-- Flag -->
    <path d="M44 0 Q62 12, 44 38 Q56 20, 44 0Z" fill="url(#accent)"/>
  </g>

  <!-- Notification bell -->
  <g transform="translate(84, 48)">
    <path d="M13 2 C6 2, 0 8, 0 16 L0 24 L-8 30 L34 30 L26 24 L26 16 C26 8, 20 2, 13 2Z" fill="#e0e0ff" opacity="0.85"/>
    <!-- Bell top circle -->
    <circle cx="13" cy="0" r="3.5" fill="#e0e0ff" opacity="0.85"/>
    <!-- Bell bottom -->
    <rect x="10" y="30" width="6" height="4" rx="2" fill="#e0e0ff" opacity="0.85"/>
  </g>

  <!-- App name text -->
  <text x="75" y="128" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#c0c0e0" letter-spacing="1">NOW ON TASKBAR</text>
</svg>
